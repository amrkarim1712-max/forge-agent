[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent-ai"
dynamic = ["version"]
description = "A portable, tool-driven AI coding agent for local software projects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Forge Agent contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["build>=1.2,<2", "pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/amrkarim1712-max/forge-agent"
Repository = "https://github.com/amrkarim1712-max/forge-agent"
Issues = "https://github.com/amrkarim1712-max/forge-agent/issues"

[project.scripts]
forge = "forge_agent.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["forge_agent*"]

[tool.setuptools.dynamic]
version = { attr = "forge_agent.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
