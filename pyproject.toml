[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.2.0"
description = "A portable, tool-driven AI coding agent for local software projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Forge Agent contributors" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
forge = "forge_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]